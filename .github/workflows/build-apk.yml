name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk chillar-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chillar-android-apk
          path: chillar-latest.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Chillar Android App v1.0.0
          draft: false
          prerelease: false
          body: |
            ### Chillar — Personal Finance for College Hostel Life
            Download the official Android APK below:
            - **[Download chillar-latest.apk](https://github.com/ankurosaurus/chillar-finance/releases/download/v1.0.0/chillar-latest.apk)**
          files: chillar-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
